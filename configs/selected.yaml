# Configuration selected by the label-free pilot of the paper (Section 5.1), read by every run on
# top of configs/defaults.yaml. Pilot: the 8 configurations of PILOT_GRID (cabsfda/experiments.py),
# seed 0, tasks A2C, M2R, G2N, E2W; ranked by the mean rank of the Soft Neighborhood Density (SND)
# on the unlabeled adaptation images; configurations with a collapsed prediction distribution
# (normalized predicted-class entropy < 0.8 on any pilot task) excluded. No target label is used.
# To redo the selection: delete this file and run
#   CABSFDA_NO_SELECTED=1 python launch.py --groups pilot --seeds 0 && python select_hparams.py
# The SND scores of the pilot runs are kept below for reference (higher is better).
selected: ema0.999
overrides:
  ema_momentum: 0.999
criterion: mean rank of SND over pilot tasks
pilot_tasks:
- A2C
- M2R
- G2N
- E2W
