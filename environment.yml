# conda env create -f environment.yml && conda activate cabsfda
# PyTorch from PyPI = CUDA 12.6 build (NVIDIA driver >= 525). For other drivers / GPUs use
# setup_env.sh, which picks the build automatically (CUDA 11.8 for old drivers, 12.8 for Blackwell).
name: cabsfda
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.7.1
      - torchvision==0.22.1
      - numpy==2.2.6
      - scipy==1.15.3
      - pandas==2.2.3
      - scikit-learn==1.6.1
      - matplotlib==3.10.3
      - PyYAML==6.0.2
      - pillow==11.2.1
